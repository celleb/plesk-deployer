name: "Plesk Deployer"
description: "Deploy applications and resources to a Plesk server via SCP"
branding:
  icon: arrow-up-circle
  color: gray-dark
inputs:
  ssh-private-key:
    description: "SSH private key for authentication"
    required: true
  ftp-username:
    description: "FTP username for Plesk server"
    required: true
  ftp-server:
    description: "FTP server address"
    required: true
  files-to-copy:
    description: "Files or directories to copy to the server"
    required: true
  remote-dir:
    description: "Remote directory to copy files to"
    required: false
    default: "/"
  node-version:
    description: "Node version running your project in plesk"
    required: false
    default: "20"
  package-manager:
    description: "Package manager to use (npm or yarn)"
    default: "npm"
    required: false
  npm-install:
    description: "Whether to install dependencies on the server"
    required: false
    default: "true"
  ship-node-modules:
    description: "Install production dependencies on the runner and upload them, instead of installing on the server (for servers with little memory). Replaces npm-install."
    required: false
    default: "false"
  restart:
    description: "Whether to restart the application"
    required: false
    default: "true"
  clean-remote-dir:
    description: "Whether to clean the remote directory before deployment"
    required: false
    default: "false"
outputs:
  deployment-status:
    description: "Status of the deployment"
    value: ${{ steps.deploy-to-plesk.outcome }}
runs:
  using: "composite"
  steps:
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    - name: Add server to known hosts
      run: |
        ssh-keyscan -H ${{ inputs.ftp-server }} >> ~/.ssh/known_hosts
      shell: bash

    - name: Clean remote directory
      if: ${{ inputs.clean-remote-dir == 'true' }}
      run: |
        ssh ${{ inputs.ftp-username }}@${{ inputs.ftp-server }} 'rm -rf ${{ inputs.remote-dir }}/*'
      shell: bash

    - name: Deploy to Plesk
      id: deploy-to-plesk
      run: |
        scp -o StrictHostKeyChecking=yes -r ${{ inputs.files-to-copy }} ${{ inputs.ftp-username }}@${{ inputs.ftp-server }}:${{ inputs.remote-dir }}
      shell: bash

    - name: Build production dependencies
      if: ${{ inputs.ship-node-modules == 'true' }}
      run: |
        STAGE="$(mktemp -d)"
        if [ "${{ inputs.package-manager }}" == "npm" ]; then
          cp package.json package-lock.json "$STAGE"/
          (cd "$STAGE" && npm ci --omit=dev --no-audit --no-fund)
        elif [ "${{ inputs.package-manager }}" == "yarn" ]; then
          cp package.json yarn.lock "$STAGE"/
          (cd "$STAGE" && yarn install --production --frozen-lockfile)
        else
          echo "Invalid package manager specified. Use 'npm' or 'yarn'."
          exit 1
        fi
        tar czf "$RUNNER_TEMP/node_modules.tgz" -C "$STAGE" node_modules
      shell: bash

    - name: Upload and swap in dependencies
      if: ${{ inputs.ship-node-modules == 'true' }}
      run: |
        scp -o StrictHostKeyChecking=yes "$RUNNER_TEMP/node_modules.tgz" ${{ inputs.ftp-username }}@${{ inputs.ftp-server }}:${{ inputs.remote-dir }}/node_modules.tgz
        # unpack beside the live folder, then swap, so the app never sees a half-installed node_modules
        ssh ${{ inputs.ftp-username }}@${{ inputs.ftp-server }} 'cd ${{ inputs.remote-dir }} && rm -rf node_modules.new node_modules.old && mkdir node_modules.new && tar xzf node_modules.tgz -C node_modules.new --strip-components=1 && rm node_modules.tgz && if [ -d node_modules ]; then mv node_modules node_modules.old; fi && mv node_modules.new node_modules && rm -rf node_modules.old'
      shell: bash

    - name: Install dependencies
      if: ${{ inputs.npm-install == 'true' && inputs.ship-node-modules != 'true' }}
      run: |
        if [ "${{ inputs.package-manager }}" == "npm" ]; then
          ssh ${{ inputs.ftp-username }}@${{ inputs.ftp-server }} 'export PATH=$PATH:/opt/plesk/node/${{ inputs.node-version }}/bin && cd ${{ inputs.remote-dir }} && npm ci'
        elif [ "${{ inputs.package-manager }}" == "yarn" ]; then
          ssh ${{ inputs.ftp-username }}@${{ inputs.ftp-server }} 'export PATH=$PATH:/opt/plesk/node/${{ inputs.node-version }}/bin && cd ${{ inputs.remote-dir }} && yarn install --frozen-lockfile'
        else
          echo "Invalid package manager specified. Use 'npm' or 'yarn'."
          exit 1
        fi
      shell: bash

    - name: Restart application
      if: ${{ inputs.restart == 'true' }}
      run: |
        ssh ${{ inputs.ftp-username }}@${{ inputs.ftp-server }} 'cd ${{ inputs.remote-dir }} && touch tmp/restart.txt'
      shell: bash
