name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Plesk
        uses: ./
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-server: ${{ secrets.FTP_SERVER }}
          files-to-copy: "./README.md"
          remote-dir: "./deployer"
          node-version: 20
          npm-install: false
          restart: true
          clean-remote-dir: false

  ship-node-modules:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: Use the fixture project
        run: cp test/fixture/package.json test/fixture/package-lock.json .

      - name: Deploy with prebuilt dependencies
        uses: ./
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-server: ${{ secrets.FTP_SERVER }}
          files-to-copy: "./package.json ./package-lock.json"
          remote-dir: "./deployer-ship"
          ship-node-modules: true
          restart: false

      - name: Check the dependency arrived
        run: ssh ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }} 'test -f ./deployer-ship/node_modules/ms/package.json && ! test -e ./deployer-ship/node_modules.tgz && echo shipped'
